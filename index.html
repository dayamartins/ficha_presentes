<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de presentes da turma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6FF; --surface:#FFFFFF; --ink:#24163A; --muted:#6D6280; --line:#E3D8F0;
  --accent:#5B3DF5; --accent-ink:#FFFFFF; --sun:#FFD23F; --sun-ink:#24163A; --chip:#F1EAFB;
  --focus:#5B3DF5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#150F20; --surface:#201932; --ink:#F2ECFF; --muted:#A99EBD; --line:#372C4D;
    --accent:#A193FF; --accent-ink:#150F20; --sun:#F5C533; --sun-ink:#1B1228; --chip:#2A2140;
    --focus:#C9C0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#150F20; --surface:#201932; --ink:#F2ECFF; --muted:#A99EBD; --line:#372C4D;
  --accent:#A193FF; --accent-ink:#150F20; --sun:#F5C533; --sun-ink:#1B1228; --chip:#2A2140;
  --focus:#C9C0FF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  font-size:1.0625rem; line-height:1.5;
  padding-bottom:6.5rem;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

.wrap{max-width:46rem; margin:0 auto; padding:0 1.25rem}

/* Hero */
.hero{
  display:grid; grid-template-columns:1fr auto; gap:2rem; align-items:center;
  padding:3rem 0 2.5rem;
}
.hero h1{
  font-size:clamp(2.4rem, 7vw, 3.75rem); line-height:.95; letter-spacing:-.03em;
  font-weight:800; margin:0 0 1rem; font-variation-settings:"opsz" 96;
}
.hero p{margin:0; color:var(--muted); max-width:30ch; font-size:1.125rem}

.tag{
  position:relative; width:13.5rem; padding:2.4rem 1.25rem 1.25rem;
  background:var(--sun); color:var(--sun-ink);
  border-radius:.9rem 3.2rem .9rem .9rem;
  transform:rotate(4deg);
  box-shadow:0 1px 0 rgba(0,0,0,.08), 6px 10px 0 var(--accent);
}
.tag::before{
  content:""; position:absolute; top:.9rem; right:1.3rem; width:1rem; height:1rem;
  border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 2px rgba(0,0,0,.15);
}
.tag::after{
  content:""; position:absolute; top:-2.2rem; right:1.7rem; width:2px; height:3.3rem;
  background:var(--accent); transform:rotate(-24deg); transform-origin:bottom;
}
.tag small{display:block; font-size:.8rem; opacity:.75}
.tag .to{font-size:1.6rem; font-weight:800; line-height:1.05; margin:.1rem 0 .9rem; word-break:break-word; letter-spacing:-.02em}
.tag .row{font-size:.95rem; font-weight:500}
.tag .meter{margin-top:.9rem; height:.4rem; border-radius:1rem; background:rgba(0,0,0,.14); overflow:hidden}
.tag .meter span{display:block; height:100%; width:0; background:var(--sun-ink); transition:width .3s ease}

@media (max-width:600px){
  .hero{grid-template-columns:1fr; padding-top:2rem; gap:2.75rem}
  .tag{justify-self:center; transform:rotate(-3deg)}
}

/* Sections */
.section{padding:2rem 0; border-top:2px dashed var(--line)}
.section h2{
  display:flex; align-items:center; gap:.6rem;
  font-size:1.6rem; line-height:1.1; margin:0 0 1.25rem; letter-spacing:-.02em; font-weight:700;
}
.section h2 .emo{font-size:1.5rem}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:1.25rem 1rem}
.field{grid-column:1 / -1; min-width:0}
.field.half{grid-column:auto}
@media (max-width:480px){ .field.half{grid-column:1 / -1} }

.field > label, .field > .label{display:block; font-weight:600; margin-bottom:.35rem}
.hint{display:block; color:var(--muted); font-size:.875rem; margin-top:.35rem; line-height:1.35}

.input{position:relative; display:flex; align-items:center}
.input input, .input textarea, .dm select{
  width:100%; background:var(--surface); border:2px solid var(--line); border-radius:.7rem;
  padding:.7rem .85rem; min-height:3rem; transition:border-color .15s;
}
.input textarea{min-height:5rem; resize:vertical}
.input input:focus, .input textarea:focus, .dm select:focus{border-color:var(--accent); outline:none}
.input .unit{position:absolute; right:.85rem; color:var(--muted); pointer-events:none; font-size:.95rem}
.input.has-unit input{padding-right:2.6rem}
::placeholder{color:var(--muted); opacity:.7}

.dm{display:grid; grid-template-columns:5.5rem 1fr; gap:.5rem}
.dm select{appearance:none; -webkit-appearance:none; cursor:pointer;
  background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:calc(100% - 1.1rem) 55%, calc(100% - .75rem) 55%;
  background-size:.35rem .35rem; background-repeat:no-repeat; padding-right:2rem;
}

.chips{display:flex; flex-wrap:wrap; gap:.45rem}
.chip{
  border:2px solid transparent; background:var(--chip); border-radius:2rem;
  padding:.45rem .9rem; cursor:pointer; font-weight:500; line-height:1.2;
  display:inline-flex; align-items:center; gap:.45rem; min-height:2.5rem;
}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.chip .sw{width:1.05rem; height:1.05rem; border-radius:50%; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18); flex:none}
.chip[aria-pressed="true"] .sw{box-shadow:0 0 0 2px var(--accent-ink)}

/* Bottom bar */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  background:var(--surface); border-top:2px solid var(--line);
  padding:.75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom));
}
.bar .wrap{display:flex; align-items:center; gap:.75rem; padding:0}
.bar p{margin:0; flex:1; font-size:.95rem; color:var(--muted); line-height:1.3}
.btn{
  border:0; border-radius:2rem; padding:.8rem 1.3rem; font-weight:700; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); min-height:3rem; white-space:nowrap;
  text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.btn.sun{background:var(--sun); color:var(--sun-ink)}
.linkbtn{background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; padding:.5rem; font-size:.95rem}

/* Result sheet */
.sheet{position:fixed; inset:0; z-index:10; display:none; background:rgba(21,15,32,.55); padding:1rem; overflow:auto}
.sheet.open{display:flex; align-items:flex-start; justify-content:center}
.card{
  background:var(--bg); width:100%; max-width:40rem; border-radius:1.2rem; margin:auto 0;
  padding:1.5rem; border:2px solid var(--line);
}
.card h3{margin:0 0 .3rem; font-size:1.6rem; letter-spacing:-.02em}
.card > p{margin:0 0 1rem; color:var(--muted)}
.preview{
  background:var(--surface); border:2px solid var(--line); border-radius:.8rem;
  padding:1rem; white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:.95rem;
  max-height:50vh; overflow:auto; margin:0 0 1rem; width:100%; color:var(--ink); resize:none; min-height:12rem;
}
.actions{display:flex; flex-wrap:wrap; gap:.6rem}
.toast{margin:.9rem 0 0; font-weight:600; min-height:1.5rem}

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div>
      <h1>Ficha de presentes</h1>
      <p>Preencha uma vez e ninguém mais erra o tamanho da sua camiseta. Pule o que não quiser responder.</p>
    </div>
    <div class="tag" aria-live="polite">
      <small>Para</small>
      <div class="to" id="tagName">você</div>
      <div class="row" id="tagDate">🎂 dia e mês</div>
      <div class="meter" aria-hidden="true"><span id="tagMeter"></span></div>
      <small style="margin-top:.35rem" id="tagPct">Ficha 0% preenchida</small>
    </div>
  </header>

  <main id="form"></main>
</div>

<div class="bar">
  <div class="wrap">
    <p>Terminou? Gere a mensagem e cole no grupo.</p>
    <button class="btn" id="genBtn" type="button">Gerar mensagem</button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="card">
    <h3 id="sheetTitle">Sua ficha está pronta</h3>
    <p id="sheetSub">Copie e cole no grupo dos amigos.</p>
    <textarea class="preview" id="preview" readonly></textarea>
    <div class="actions">
      <button class="btn" id="copyBtn" type="button">Copiar texto</button>
      <a class="btn sun" id="waBtn" href="#" target="_blank" rel="noopener">Abrir no WhatsApp</a>
      <button class="btn ghost" id="closeBtn" type="button">Voltar e editar</button>
    </div>
    <p class="toast" id="toast" role="status"></p>
    <button class="linkbtn" id="clearBtn" type="button">Apagar tudo e começar de novo</button>
  </div>
</div>

<script>
const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const COLORS = [
  ["Preto","#111111"],["Branco","#FFFFFF"],["Cinza","#9A9A9A"],["Bege","#E3D2B4"],["Marrom","#7A4A2A"],
  ["Vermelho","#D62828"],["Vinho","#6D1A36"],["Rosa-claro","#F7B7C9"],["Pink","#F0359B"],["Laranja","#F77F00"],
  ["Amarelo","#FCD34D"],["Verde-claro","#9BD67A"],["Verde","#2E8B57"],["Verde-oliva","#6B7A2E"],
  ["Azul-claro","#8EC9F2"],["Azul","#2B6CD9"],["Azul-marinho","#1B2A55"],["Lilás","#C8A8E9"],
  ["Roxo","#6A3FB5"],["Dourado","#C9A13B"],["Prata","#C0C4CC"],["Neon","#C6FF00"]
];

const SECTIONS = [
  {emoji:"🙋", title:"Sobre você", fields:[
    {id:"nome", label:"Nome", placeholder:"Como a turma te chama", half:true},
    {id:"aniver", label:"Aniversário", type:"daymonth", half:true},
  ]},
  {emoji:"👟", title:"Calçados", fields:[
    {id:"sapato_num", label:"Número", placeholder:"ex: 37", mode:"numeric", half:true},
    {id:"sapato_cm", label:"Comprimento do pé", unit:"cm", placeholder:"ex: 24,5", mode:"decimal", half:true,
      hint:"Pise numa folha, marque o calcanhar e a ponta do dedo maior e meça."},
    {id:"sapato_obs", label:"Algo a saber?", placeholder:"ex: pé largo, fico entre dois números"},
  ]},
  {emoji:"👕", title:"Camisetas e blusas", fields:[
    {id:"cam_letra", label:"Tamanho", type:"chips", options:["PP","P","M","G","GG","XG","XGG"],
      hint:"Se varia, marque mais de um."},
    {id:"cam_busto", label:"Busto ou tórax", unit:"cm", mode:"decimal", half:true, placeholder:"ex: 92",
      hint:"Fita métrica na parte mais larga do peito."},
    {id:"cam_comp", label:"Comprimento", unit:"cm", mode:"decimal", half:true, placeholder:"ex: 65",
      hint:"Do ombro até a barra, numa camiseta que você ama."},
    {id:"cam_caimento", label:"Caimento que prefere", type:"chips", options:["Bem justinha","Ajustada","Normal","Larguinha","Oversized"]},
    {id:"cam_modelo", label:"Modelos que usa", type:"chips", options:["Baby look","Corte reto","Cropped","Regata","Manga longa","Gola V","Gola careca","Polo","Moletom"]},
    {id:"cam_obs", label:"Detalhes", placeholder:"ex: não gosto de estampa grande, prefiro algodão"},
  ]},
  {emoji:"👖", title:"Calças, shorts e saias", fields:[
    {id:"calca_num", label:"Número", placeholder:"ex: 40 ou M", half:true},
    {id:"calca_cintura", label:"Cintura", unit:"cm", mode:"decimal", placeholder:"ex: 74", half:true},
    {id:"calca_modelo", label:"Modelos que curte", type:"chips", options:["Skinny","Reta","Wide leg","Mom jeans","Jogger","Cintura alta","Cintura baixa","Short","Saia","Vestido"]},
  ]},
  {emoji:"💍", title:"Acessórios", fields:[
    {id:"anel", label:"Aro do anel", placeholder:"ex: 16", mode:"numeric", half:true},
    {id:"brinco", label:"Orelha furada?", type:"chips", single:true, options:["Não","Um furo","Vários furos"], half:true},
    {id:"metal", label:"Prefere", type:"chips", options:["Prata","Dourado","Rosé","Tanto faz"]},
    {id:"acess_obs", label:"Usa ou gostaria de usar", placeholder:"ex: relógio, boné, bolsa pequena, óculos de sol"},
  ]},
  {emoji:"🎨", title:"Cores", fields:[
    {id:"cores_sim", label:"Cores que ama", type:"colors"},
    {id:"cores_nao", label:"Cores que evita", type:"colors"},
    {id:"cores_obs", label:"Algum detalhe?", placeholder:"ex: amo verde, mas não verde-limão"},
  ]},
  {emoji:"🍿", title:"Personagens e fandoms", fields:[
    {id:"filmes", label:"Filmes", type:"textarea", placeholder:"Sagas, filmes e personagens favoritos"},
    {id:"desenhos", label:"Desenhos e animações", type:"textarea", placeholder:"Os de hoje e os da infância"},
    {id:"series", label:"Séries", type:"textarea", placeholder:"Qual você maratona de novo?"},
    {id:"animes", label:"Animes e mangás", type:"textarea", placeholder:"Personagens favoritos também valem"},
    {id:"games", label:"Games", placeholder:"Jogos e plataforma (PC, console, celular)"},
    {id:"musica", label:"Música e podcasts", placeholder:"Bandas, cantores, gêneros"},
  ]},
  {emoji:"🧶", title:"Hobbies", fields:[
    {id:"hobbies", label:"O que você curte fazer", type:"chips", options:["Leitura","Cerâmica","Pintura","Desenho","Crochê ou tricô","Bordado","Costura","Cozinhar","Confeitaria","Plantas","Games","Jogos de tabuleiro","Puzzle e Lego","Fotografia","Tocar instrumento","Dança","Academia","Corrida","Yoga","Trilha","Bike","Maquiagem","Skincare","Café","Vinho e drinks","Viajar","Pets","Papelaria","Colecionar"]},
    {id:"livros", label:"Tipos de livro", type:"chips", options:["Fantasia","Romance","Suspense","Terror","Ficção científica","Clássicos","Não ficção","Autoajuda","Biografias","Mangá e HQ","Poesia","Jovem adulto"]},
    {id:"hobbies_obs", label:"Detalhes que ajudam", type:"textarea", placeholder:"ex: faço cerâmica há 1 ano e quero aprender torno; coleciono canecas; leio mais no Kindle"},
  ]},
  {emoji:"🍫", title:"Gostos do dia a dia", fields:[
    {id:"comidas", label:"Comidas e doces favoritos", placeholder:"ex: chocolate meio amargo, pão de queijo"},
    {id:"bebidas", label:"Bebidas", placeholder:"ex: café sem açúcar, chá gelado"},
    {id:"cheiros", label:"Cheiros e perfumes", placeholder:"ex: amadeirado, floral, baunilha"},
    {id:"estilo", label:"Seu estilo", type:"chips", options:["Básico","Esportivo","Romântico","Alternativo","Streetwear","Clássico","Colorido","Boho","Minimalista","Nerd"]},
  ]},
  {emoji:"🎁", title:"Na hora do presente", fields:[
    {id:"tipo", label:"Prefere ganhar", type:"chips", options:["Objeto","Roupa","Experiência","Comida","Vale-presente","Feito à mão","Tanto faz"]},
    {id:"desejos", label:"Lista de desejos", type:"textarea", placeholder:"Coisas que você quer, com link se tiver"},
    {id:"nao_quer", label:"Não precisa me dar", type:"textarea", placeholder:"ex: já tenho muitas canecas, não uso bijuteria"},
    {id:"restricoes", label:"Alergias e restrições", placeholder:"ex: lactose, perfume forte, níquel, vegano"},
  ]},
];

const KEY = "ficha-presentes-v1";
let state = {};
try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw) || {}; } catch (e) { state = {}; }

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }, 300);
  updateTag();
}

function el(tag, attrs = {}, kids = []){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v === undefined || v === null || v === false) continue;
    if (k === "text") n.textContent = v;
    else if (k === "class") n.className = v;
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}

function renderField(f){
  const type = f.type || "text";
  const wrap = el("div", {class: "field" + (f.half ? " half" : "")});
  const inputId = "f_" + f.id;
  const hintId = f.hint ? inputId + "_hint" : null;

  if (type === "chips" || type === "colors"){
    const labelId = inputId + "_label";
    wrap.append(el("div", {class:"label", id:labelId, text:f.label}));
    const group = el("div", {class:"chips", role:"group", "aria-labelledby":labelId, "aria-describedby":hintId});
    const opts = type === "colors" ? COLORS : f.options.map(o => [o]);
    if (!Array.isArray(state[f.id])) state[f.id] = state[f.id] ? [state[f.id]] : [];
    opts.forEach(([name, hex]) => {
      const pressed = state[f.id].includes(name);
      const b = el("button", {type:"button", class:"chip", "aria-pressed": String(pressed)});
      if (hex) b.append(el("span", {class:"sw", style:"background:" + hex, "aria-hidden":"true"}));
      b.append(document.createTextNode(name));
      b.addEventListener("click", () => {
        let arr = state[f.id];
        if (arr.includes(name)) arr = arr.filter(x => x !== name);
        else arr = f.single ? [name] : [...arr, name];
        state[f.id] = arr;
        group.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(arr.includes(c.textContent))));
        save();
      });
      group.append(b);
    });
    wrap.append(group);
  } else if (type === "daymonth"){
    const v = state[f.id] || {};
    wrap.append(el("div", {class:"label", id:inputId + "_label", text:f.label}));
    const dm = el("div", {class:"dm", role:"group", "aria-labelledby":inputId + "_label"});
    const sd = el("select", {"aria-label":"Dia"});
    sd.append(el("option", {value:"", text:"Dia"}));
    for (let i = 1; i <= 31; i++) sd.append(el("option", {value:String(i), text:String(i)}));
    const sm = el("select", {"aria-label":"Mês"});
    sm.append(el("option", {value:"", text:"Mês"}));
    MONTHS.forEach((m, i) => sm.append(el("option", {value:String(i + 1), text:m})));
    sd.value = v.d || ""; sm.value = v.m || "";
    const upd = () => { state[f.id] = {d: sd.value, m: sm.value}; save(); };
    sd.addEventListener("change", upd); sm.addEventListener("change", upd);
    dm.append(sd, sm);
    wrap.append(dm);
  } else {
    wrap.append(el("label", {for:inputId, text:f.label}));
    const box = el("div", {class:"input" + (f.unit ? " has-unit" : "")});
    const inp = type === "textarea"
      ? el("textarea", {id:inputId, placeholder:f.placeholder, rows:"3", "aria-describedby":hintId})
      : el("input", {id:inputId, type:"text", placeholder:f.placeholder, inputmode:f.mode, "aria-describedby":hintId, autocomplete: f.id === "nome" ? "given-name" : "off"});
    inp.value = state[f.id] || "";
    inp.addEventListener("input", () => { state[f.id] = inp.value; save(); });
    box.append(inp);
    if (f.unit) box.append(el("span", {class:"unit", "aria-hidden":"true", text:f.unit}));
    wrap.append(box);
  }
  if (f.hint) wrap.append(el("span", {class:"hint", id:hintId, text:f.hint}));
  return wrap;
}

function render(){
  const root = document.getElementById("form");
  SECTIONS.forEach(s => {
    const sec = el("section", {class:"section"});
    const h = el("h2");
    h.append(el("span", {class:"emo", "aria-hidden":"true", text:s.emoji}), document.createTextNode(s.title));
    const grid = el("div", {class:"grid"});
    s.fields.forEach(f => grid.append(renderField(f)));
    sec.append(h, grid);
    root.append(sec);
  });
  updateTag();
}

function valueText(f){
  const v = state[f.id];
  const type = f.type || "text";
  if (type === "daymonth"){
    if (!v || (!v.d && !v.m)) return "";
    if (v.d && v.m) return v.d + " de " + MONTHS[+v.m - 1];
    return v.m ? MONTHS[+v.m - 1] : "dia " + v.d;
  }
  if (Array.isArray(v)) return v.join(", ");
  const t = (v || "").trim();
  if (!t) return "";
  return f.unit && !/[a-z]/i.test(t) ? t + " " + f.unit : t;
}

function allFields(){ return SECTIONS.flatMap(s => s.fields); }

function updateTag(){
  const nome = (state.nome || "").trim();
  document.getElementById("tagName").textContent = nome || "você";
  const d = valueText(SECTIONS[0].fields[1]);
  document.getElementById("tagDate").textContent = "🎂 " + (d || "dia e mês");
  const fs = allFields();
  const filled = fs.filter(f => valueText(f)).length;
  const pct = Math.round(filled / fs.length * 100);
  document.getElementById("tagMeter").style.width = pct + "%";
  document.getElementById("tagPct").textContent = "Ficha " + pct + "% preenchida";
}

function buildMessage(){
  const nome = (state.nome || "").trim();
  const lines = ["🎁 *Ficha de presentes" + (nome ? " de " + nome : "") + "*"];
  const aniver = valueText(SECTIONS[0].fields[1]);
  if (aniver) lines.push("🎂 Aniversário: " + aniver);
  SECTIONS.slice(1).forEach(s => {
    const rows = s.fields.map(f => [f.label, valueText(f)]).filter(([, v]) => v);
    if (!rows.length) return;
    lines.push("", s.emoji + " *" + s.title + "*");
    rows.forEach(([l, v]) => lines.push("• " + l + ": " + v.replace(/\n+/g, "; ")));
  });
  return lines.join("\n");
}

const sheet = document.getElementById("sheet");
const preview = document.getElementById("preview");
const toast = document.getElementById("toast");
let lastFocus = null;

document.getElementById("genBtn").addEventListener("click", () => {
  const nome = (state.nome || "").trim();
  if (!nome){
    const inp = document.getElementById("f_nome");
    inp.focus();
    inp.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    inp.setAttribute("placeholder", "Coloque seu nome para gerar a ficha");
    return;
  }
  const msg = buildMessage();
  preview.value = msg;
  document.getElementById("waBtn").href = "https://wa.me/?text=" + encodeURIComponent(msg);
  toast.textContent = "";
  lastFocus = document.activeElement;
  sheet.classList.add("open");
  document.getElementById("copyBtn").focus();
});

function closeSheet(){ sheet.classList.remove("open"); if (lastFocus) lastFocus.focus(); }
document.getElementById("closeBtn").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet.classList.contains("open")) closeSheet(); });

document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = preview.value;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    try { preview.focus(); preview.select(); ok = document.execCommand("copy"); } catch (e2) { ok = false; }
  }
  if (ok) toast.textContent = "Copiado. Agora é só colar no grupo.";
  else { preview.focus(); preview.select(); toast.textContent = "Não deu para copiar automaticamente. O texto está selecionado: copie pelo menu do seu celular."; }
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("Apagar todas as respostas desta ficha?")) return;
  state = {};
  try { localStorage.removeItem(KEY); } catch (e) {}
  document.getElementById("form").innerHTML = "";
  sheet.classList.remove("open");
  render();
  window.scrollTo(0, 0);
});

render();
</script>
</body>
</html>
